<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MedHelp 使用指南" />
  <meta name="theme-color" content="#eef2f5" />
  <title>使用指南</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root {
      --ink: #17221f;
      --muted: #6f7e79;
      --paper: #f4f3ed;
      --accent: #1b7f68;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      padding: 48px 24px;
      color: var(--ink);
      background: var(--paper);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(560px, 100%);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 0 0 16px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 600;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">MedHelp</p>
    <h1>使用指南</h1>
    <p class="subtitle">你的研究生 AI 助理</p>
    <p>帮助内容将在后续补充。</p>
  </main>
</body>
</html>
