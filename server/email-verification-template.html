<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedTimeHelp 邮箱验证码</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f7fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
      您正在验证 MedTimeHelp 邮箱，验证码 5 分钟内有效。
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f4f7fb;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px;">
            <tr>
              <td style="padding:32px;">
                <div style="font-size:22px;line-height:30px;font-weight:700;color:#2563eb;margin-bottom:24px;">
                  MedTimeHelp
                </div>
                <div style="font-size:20px;line-height:28px;font-weight:700;margin-bottom:12px;">
                  邮箱验证码
                </div>
                <p style="margin:0 0 20px;font-size:15px;line-height:24px;color:#4b5563;">
                  您正在注册 MedTimeHelp。请使用以下验证码完成邮箱验证：
                </p>
                <div style="margin:0 0 20px;padding:18px 16px;background-color:#eff6ff;border-radius:8px;text-align:center;font-size:32px;line-height:40px;font-weight:700;letter-spacing:8px;color:#1d4ed8;">
                  {{code}}
                </div>
                <p style="margin:0 0 8px;font-size:14px;line-height:22px;color:#4b5563;">
                  验证码将在 5 分钟后失效，请勿向他人透露。
                </p>
                <p style="margin:0;font-size:14px;line-height:22px;color:#6b7280;">
                  如果不是您本人操作，请忽略此邮件。
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px;border-top:1px solid #e5e7eb;font-size:12px;line-height:20px;color:#9ca3af;text-align:center;">
                此邮件由 MedTimeHelp 系统自动发送，请勿直接回复。
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
